<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedtime Story Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,18..144,400;0,18..144,500;0,18..144,600;1,18..144,400&display=swap">
<style>
  :root{
    /* Dark storybook palette (shared by the hero band and the whole page) */
    --paper:#170f36;
    --paper-card:#241a52;
    --paper-deep:#362a70;
    --night-deep:#170f36;
    --night:#241a52;
    --night-soft:#362a70;
    --ink:#f4f1ff;
    --ink-soft:#b7bce6;
    --ink-faint:#8489bd;
    --cream:#f6f1ff;
    --gold:#d99a3f;
    --gold-light:#f3c876;
    --gold-ink:#4a2f08;
    --accent:#7b6fd6;
    --accent-soft:#e7e2fb;
    --shadow-sm: 0 6px 16px -9px rgba(0,0,0,0.45);
    --shadow-md: 0 16px 32px -14px rgba(0,0,0,0.50);
    --shadow-lg: 0 26px 52px -20px rgba(0,0,0,0.60);
  }

  *{ box-sizing:border-box; }

  html{
    min-height: 100%;
    background: var(--paper);
  }

  body{
    margin:0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Baloo 2', ui-rounded, 'Segoe UI', system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  h1,h2,h3,p{ margin:0; }

  /* ---------- Hero / storybook cover ---------- */

  .hero-sky{
    position:relative;
    width:100%;
    overflow:hidden;
    background:
      radial-gradient(1.6px 1.6px at 10% 22%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 24% 65%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 36% 30%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 50% 78%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 64% 18%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 79% 52%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 89% 28%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 94% 70%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 16% 88%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 58% 46%, #fff, transparent),
      linear-gradient(160deg, var(--night-deep), var(--night) 55%, var(--night-soft));
    border-radius: 0 0 32px 32px;
    box-shadow: var(--shadow-lg);
  }

  .hero-inner{
    max-width: 620px;
    margin: 0 auto;
    padding: 44px 24px 60px;
    text-align:center;
  }

  .moon{
    display:block;
    margin: 0 auto 16px;
    filter: drop-shadow(0 0 14px rgba(255,191,92,0.45));
  }

  .sparkle{
    position:absolute;
    color: var(--gold-light);
    opacity:.85;
    animation: twinkle 3.4s ease-in-out infinite;
  }
  .sparkle.s1{ top: 26%; left: 14%; font-size: 14px; animation-delay: .2s; }
  .sparkle.s2{ top: 62%; right: 12%; font-size: 11px; animation-delay: 1.1s; }
  .sparkle.s3{ top: 18%; right: 22%; font-size: 9px; animation-delay: 2s; }

  @keyframes twinkle{
    0%,100%{ opacity:.25; transform: scale(0.85); }
    50%{ opacity: 1; transform: scale(1); }
  }

  .eyebrow{
    font-family: 'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 12.5px;
    letter-spacing: 0.18em;
    color: var(--gold-light);
    text-transform: uppercase;
    margin: 0 0 12px;
  }

  h1{
    color: var(--cream);
    font-size: clamp(30px, 6.4vw, 46px);
    line-height:1.12;
    text-wrap: balance;
    font-weight: 800;
    margin-bottom: 14px;
  }

  .sub{
    color: #cbc3f2;
    font-family: Literata, Georgia, serif;
    font-style: italic;
    font-size: 17px;
    max-width: 42ch;
    margin: 0 auto;
    line-height:1.55;
  }

  /* ---------- Page / content ---------- */

  .page{
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 18px 90px;
  }

  .progress-trail{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto 34px;
    padding: 12px 18px;
    background: var(--paper-card);
    border-radius: 999px;
    box-shadow: var(--shadow-md);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .progress-step{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    min-width: 46px;
    opacity:.45;
    transform: scale(0.96);
    transition: opacity .25s ease, transform .25s ease;
  }
  .progress-step .ico{ font-size:19px; line-height:1; }
  .progress-step .label{
    font-size: 9.5px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color: var(--ink-soft);
    white-space:nowrap;
  }
  .progress-step.done,
  .progress-step.active{ opacity:1; transform: scale(1.08); }
  .progress-step.active .label{ color: var(--gold); }

  .progress-line{
    width:18px;
    height:2px;
    border-radius:2px;
    background: var(--paper-deep);
    flex: none;
  }

  /* ---------- Step cards ---------- */

  .step-card{
    background: var(--paper-card);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 26px;
    padding: 26px clamp(18px, 4vw, 30px) 28px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 22px;
  }

  .step-head{
    display:flex;
    align-items:flex-start;
    gap:14px;
    margin-bottom: 20px;
  }

  .step-num{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px; height:34px;
    border-radius:50%;
    background: linear-gradient(160deg, var(--gold-light), var(--gold));
    color: var(--gold-ink);
    font-weight:800;
    font-size:15px;
    box-shadow: 0 6px 14px -6px rgba(217,154,63,0.55);
  }

  .step-title{
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    line-height:1.3;
    text-wrap: balance;
  }

  .step-hint{
    font-family: Literata, Georgia, serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 14.5px;
    margin-top: 3px;
  }

  .mini-group{ margin-bottom: 18px; }
  .mini-group:last-child{ margin-bottom:0; }

  .mini-label{
    font-size: 12.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px 2px;
  }

  /* ---------- Name field ---------- */

  .name-field{ margin-top: 10px; }

  .name-label{
    display:block;
    font-size: 12px;
    font-weight:600;
    color: var(--ink-faint);
    margin: 0 0 6px 2px;
  }
  .name-label .optional{
    font-weight:500;
    opacity:.75;
  }

  .name-input{
    display:block;
    width:100%;
    font-family:'Baloo 2', sans-serif;
    font-size: 15px;
    font-weight:600;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: var(--shadow-sm);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .name-input::placeholder{ color: var(--ink-faint); font-weight:500; }
  .name-input:focus-visible{
    outline:none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(217,154,63,0.22), var(--shadow-sm);
  }

  /* ---------- Pronoun field ---------- */

  .pronoun-field{ margin-top: 10px; }

  .pronoun-select{
    display:block;
    width:100%;
    font-family:'Baloo 2', sans-serif;
    font-size: 15px;
    font-weight:600;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: var(--shadow-sm);
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b7bce6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 16px;
    padding-right: 38px;
    cursor:pointer;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .pronoun-select:focus-visible{
    outline:none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(217,154,63,0.22), var(--shadow-sm);
  }
  .pronoun-select option{ background: var(--paper-card); color: var(--ink); }

  /* ---------- Choice grid / cards ---------- */

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap:11px;
  }

  .pick-btn{
    position:relative;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 16px 8px 13px;
    min-height: 92px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease, color .15s ease;
  }

  .pick-btn .emoji{
    display:flex;
    align-items:center;
    justify-content:center;
    width:46px; height:46px;
    border-radius:50%;
    background: var(--paper-deep);
    font-size: 24px;
    line-height:1;
    transition: transform .15s ease, background .15s ease;
  }

  .pick-btn.has-sub{ min-height: 104px; gap:5px; }

  .pick-sub{
    font-size: 10.5px;
    font-weight:600;
    letter-spacing:.02em;
    color: var(--ink-faint);
    margin-top:-4px;
  }
  .pick-btn[aria-pressed="true"] .pick-sub{ color: var(--gold-light); opacity:.9; }

  .pick-btn:hover{
    transform: translateY(-3px);
    border-color: rgba(217,154,63,0.4);
    box-shadow: var(--shadow-md);
    color: var(--ink);
  }

  .pick-btn:active{
    transform: translateY(-1px) scale(0.97);
  }

  .pick-btn:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .pick-btn[aria-pressed="true"]{
    background: var(--paper-card);
    border-color: var(--gold);
    color: var(--ink);
    box-shadow: 0 0 0 3px rgba(217,154,63,0.22), var(--shadow-md);
  }

  .pick-btn[aria-pressed="true"] .emoji{
    background: linear-gradient(160deg, var(--gold-light), var(--gold));
    transform: scale(1.06);
  }

  .pick-btn[aria-pressed="true"]::after{
    content: "\2713";
    position:absolute;
    top:-6px; right:-6px;
    width:21px; height:21px;
    border-radius:50%;
    background: var(--gold);
    color:#fff9ec;
    font-size:11px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 3px 8px -2px rgba(217,154,63,0.7);
  }

  .pick-btn.shake{
    animation: shake .35s ease;
  }

  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-4px); }
    75%{ transform: translateX(4px); }
  }

  /* ---------- Recipe ticket + CTA ---------- */

  .cta-card{
    background: linear-gradient(175deg, var(--paper-card), var(--paper-deep));
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 26px;
    padding: 28px clamp(18px, 4vw, 34px) 32px;
    box-shadow: var(--shadow-md);
    text-align:center;
  }

  .recipe{
    font-family: Literata, Georgia, serif;
    font-style: italic;
    color: var(--ink-soft);
    min-height: 26px;
    margin: 0 0 24px;
    font-size: 16px;
    line-height:1.55;
  }
  .recipe strong{
    color: var(--gold-light);
    font-style: normal;
    font-weight: 600;
  }

  .create-row{
    display:flex;
    justify-content:center;
  }

  #createBtn{
    width:100%;
    max-width: 360px;
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--gold-ink);
    background: linear-gradient(160deg, var(--gold-light), var(--gold));
    border: none;
    border-radius: 999px;
    padding: 18px 30px;
    cursor:pointer;
    box-shadow: 0 16px 30px -12px rgba(217,154,63,0.65);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    animation: pulseGlow 2.6s ease-in-out infinite;
  }
  #createBtn:hover:not(:disabled){ transform: translateY(-2px); }
  #createBtn:active:not(:disabled){ transform: translateY(0) scale(0.98); }
  #createBtn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  #createBtn:disabled{
    opacity:.4;
    cursor:not-allowed;
    box-shadow:none;
    animation:none;
  }

  @keyframes pulseGlow{
    0%,100%{ box-shadow: 0 16px 30px -12px rgba(217,154,63,0.65); }
    50%{ box-shadow: 0 16px 34px -8px rgba(217,154,63,0.85); }
  }

  .status-note{
    color: var(--ink-faint);
    font-size: 13.5px;
    margin-top:14px;
    min-height: 18px;
    font-family: Literata, Georgia, serif;
    font-style: italic;
  }

  /* ---------- Result: loading / story / notice ---------- */

  #result{ margin-top: 30px; }
  #result[hidden]{ display:none; }

  .loading{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding: 38px 10px 18px;
    background: var(--paper-card);
    border-radius: 26px;
    box-shadow: var(--shadow-sm);
  }

  .loading-moon{
    font-size: 40px;
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0) rotate(-4deg); }
    50%{ transform: translateY(-8px) rotate(4deg); }
  }

  .loading-text{
    font-family: Literata, Georgia, serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
    text-align:center;
    min-height: 24px;
  }

  @keyframes storyIn{
    from{ opacity:0; transform: translateY(16px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .story-card{
    position:relative;
    background: var(--paper-card);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 28px;
    padding: 40px clamp(22px, 6vw, 54px) 46px;
    box-shadow: var(--shadow-lg);
    overflow:hidden;
    animation: storyIn .5s ease both;
  }

  .story-card::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:7px;
    background: linear-gradient(180deg, var(--gold-light), var(--accent));
  }

  .story-meta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    color: var(--gold-light);
    background: var(--paper-deep);
    width:fit-content;
    margin: 0 auto 18px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .story-title{
    text-align:center;
    font-size: clamp(25px, 4.6vw, 34px);
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 8px;
    text-wrap: balance;
  }

  .story-divider{
    text-align:center;
    color: var(--gold);
    letter-spacing: 10px;
    font-size: 13px;
    margin: 12px 0 26px;
  }

  /* ---------- Read aloud controls ---------- */

  .read-aloud-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin: 0 0 28px;
  }

  .read-btn, .stop-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border-radius: 999px;
    padding: 10px 22px;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .read-btn{
    color: var(--gold-ink);
    background: linear-gradient(160deg, var(--gold-light), var(--gold));
    border: none;
    box-shadow: 0 10px 20px -10px rgba(217,154,63,0.6);
  }
  .read-btn:hover{ transform: translateY(-2px); }
  .read-btn:active{ transform: translateY(0) scale(0.97); }
  .stop-btn{
    color: var(--ink);
    background: var(--paper);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: var(--shadow-sm);
  }
  .stop-btn:hover{ border-color: var(--gold); transform: translateY(-2px); }
  .stop-btn:active{ transform: translateY(0) scale(0.97); }
  .read-btn:focus-visible, .stop-btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .stop-btn[hidden]{ display:none; }

  .story-text{
    font-family: Literata, Georgia, serif;
    font-size: 18.5px;
    line-height: 1.85;
    color: #ece7ff;
    max-width: 62ch;
    margin: 0 auto;
  }
  .story-text p{
    margin: 0 0 22px;
    border-radius: 10px;
    transition: box-shadow .2s ease, background .2s ease;
  }
  .story-text p:last-child{ margin-bottom:0; }
  .story-text p.speaking{
    background: rgba(217,154,63,0.14);
    box-shadow: 0 0 0 8px rgba(217,154,63,0.14);
  }
  .story-text p:first-of-type::first-letter{
    font-family: Literata, Georgia, serif;
    font-weight: 600;
    font-size: 3.1em;
    line-height: 0.78;
    float:left;
    padding: 4px 9px 0 0;
    color: var(--gold);
  }

  .again-row{
    display:flex;
    justify-content:center;
    margin-top: 30px;
  }

  #againBtn{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    background: var(--paper-card);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px;
    padding: 13px 26px;
    cursor:pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  #againBtn:hover{ transform: translateY(-2px); border-color: var(--gold); box-shadow: var(--shadow-md); }
  #againBtn:active{ transform: translateY(0) scale(0.98); }
  #againBtn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }

  .notice{
    text-align:center;
    font-family: Literata, Georgia, serif;
    color: var(--ink-soft);
    background: var(--paper-card);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 22px 24px;
    font-size: 15.5px;
    line-height:1.6;
    box-shadow: var(--shadow-sm);
  }
  .notice.error{
    border-color: rgba(217,154,63,0.4);
  }

  footer.credit{
    text-align:center;
    color: var(--ink-faint);
    font-size: 12.5px;
    margin-top: 40px;
    letter-spacing:0.04em;
  }

  @media (max-width: 480px){
    .hero-inner{ padding: 36px 20px 52px; }
    .step-card, .cta-card{ padding-left: 16px; padding-right:16px; }
    #createBtn{ font-size: 18px; padding: 17px 24px; }
    .story-card{ padding-left: 20px; padding-right: 20px; border-radius: 22px; }
    .story-text{ font-size: 17.5px; }
